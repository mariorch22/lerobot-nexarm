# From the plugin repo: uv run lerobot-teleoperate --config_path=examples/nexarm/teleoperate.yaml
# Current setup: follower COM13, leader COM14. Recheck ports / camera indices for other setups.
robot:
  type: nexarm_follower
  id: follower
  calibration_dir: calibration/follower
  port: COM13
  baudrate: 1000000
  use_degrees: true
  disable_torque_on_disconnect: false
  readback_after_write: true
  cameras:
    scene:
      type: opencv
      index_or_path: 1
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
    wrist:
      type: opencv
      index_or_path: 2
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
teleop:
  type: nexarm_leader
  id: leader
  calibration_dir: calibration/leader
  follower_calibration_path: calibration/follower/follower.json
  port: COM14
  baudrate: 1000000
  use_degrees: true
display_data: false
fps: 30
